[workspace]
name = "warrior1_2027"
description = "ROS 2 Jazzy + Gazebo Harmonic workspace for the Wayne State Robotics Warrior platform"
# RoboStack provides ROS 2 as conda packages, so no system-wide /opt/ros install is needed.
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
# --- Build tooling ---
python = "3.12.*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
setuptools = "<80"  # colcon --symlink-install breaks with setuptools>=80 (removed develop --editable)
colcon-common-extensions = "*"
rosdep = "*"

# --- ROS 2 Jazzy ---
ros-jazzy-desktop = "*"           # rclcpp/rclpy, rviz2, demo nodes, launch, tf2, ...
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"

# --- Gazebo Harmonic + ROS bridge ---
ros-jazzy-ros-gz = "*"            # ros_gz_sim, ros_gz_bridge, ros_gz_image (pulls in gz-sim8)

# --- Lint / test (used by `colcon test`) ---
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-lint-common = "*"
ros-jazzy-ament-copyright = "*"
ros-jazzy-ament-flake8 = "*"
ros-jazzy-ament-pep257 = "*"
pytest = "*"

[target.linux.dependencies]
libgl-devel = "*"

# Tasks run from the repo root. Workspace build artifacts (build/ install/ log/)
# land in the repo root and are git-ignored.
[tasks]
build = { cmd = "colcon build --symlink-install", description = "Build all workspace packages" }
test = { cmd = "colcon test --event-handlers console_direct+ && colcon test-result --verbose", depends-on = ["build"], description = "Build, then run all package tests" }
clean = { cmd = "rm -rf build install log", description = "Remove colcon build artifacts" }

# Launch tasks source the workspace overlay first.
display = { cmd = "bash -c 'source install/setup.bash && ros2 launch warrior1_description display.launch.py'", depends-on = ["build"], description = "Show the robot model in RViz2" }
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch warrior1_bringup sim.launch.py'", depends-on = ["build"], description = "Launch Gazebo Harmonic with the robot spawned" }
sim-headless = { cmd = "bash -c 'source install/setup.bash && ros2 launch warrior1_bringup sim.launch.py headless:=true'", depends-on = ["build"], description = "Launch Gazebo server only (no GUI)" }
talker-listener = { cmd = "bash -c 'source install/setup.bash && ros2 launch warrior1_bringup test_bringup.launch.py'", depends-on = ["build"], description = "Sanity-check ROS 2 with demo talker/listener nodes" }
