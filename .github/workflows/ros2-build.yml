name: ROS 2 Jazzy CI (pixi)

# Builds and tests the workspace in the same pixi environment developers use
# locally (ROS 2 Jazzy + Gazebo Harmonic from RoboStack), pinned by pixi.lock.
on:
  push:
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - '**/CMakeLists.txt'
      - '**/package.xml'
      - '**/setup.py'
      - '**/setup.cfg'
      - '**/*.py'
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.xacro'
      - '**/*.urdf'
      - '**/*.sdf'
      - '**/*.yaml'
      - '**/*.sh'
      - '.github/workflows/ros2-build.yml'
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
          cache: true

      - name: colcon build
        run: pixi run build

      # `test` depends on `build`, which is a no-op re-run at this point.
      - name: colcon test
        run: pixi run test
