name: ROS 2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ros2-ci:
    name: ROS 2 Humble validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f .devcontainer/docker-compose.yml config --quiet

      - name: Build development image
        run: docker compose -f .devcontainer/docker-compose.yml build ros2

      # Keep one container alive so packages installed in the rosdep test
      # remain available to the syntax checks and colcon build. The entrypoint
      # is syntax-checked below; rosdep runs as its own named step so failures
      # are easier to diagnose and cannot race against entrypoint startup.
      - name: Start CI container
        run: |
          docker compose -f .devcontainer/docker-compose.yml run \
            --detach \
            --no-deps \
            --name warrior1-ci \
            --entrypoint /bin/bash \
            ros2 -lc 'sleep infinity'

      - name: Test 1 - resolve and check rosdep dependencies
        run: |
          docker exec -i -w /ros2_ws/src/Warrior1_2027 warrior1-ci bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          source /opt/ros/humble/setup.bash

          if [ ! -d src ]; then
            echo "Expected a src/ directory in the repository workspace." >&2
            exit 1
          fi

          manifest_count=$(find src -type f -name package.xml | wc -l)
          if [ "$manifest_count" -eq 0 ]; then
            echo "No package.xml files found under src/." >&2
            exit 1
          fi
          echo "Found $manifest_count package.xml manifest(s)."

          sudo apt-get update
          rosdep update --rosdistro humble
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro humble \
            -r -y
          rosdep check \
            --from-paths src \
            --ignore-src \
            --rosdistro humble
          CONTAINER_SCRIPT

      - name: Test 2 - parse XML/Python, check scripts, and build with colcon
        run: |
          docker exec -i -w /ros2_ws/src/Warrior1_2027 warrior1-ci bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          source /opt/ros/humble/setup.bash

          python3 - <<'PY'
          import os
          import sys
          import tokenize
          import xml.etree.ElementTree as ET
          from pathlib import Path

          excluded_dirs = {
              ".git", "build", "install", "log", "__pycache__",
              ".venv", "venv", "node_modules"
          }
          xml_suffixes = {".xml", ".xacro", ".urdf", ".sdf", ".world"}
          xml_files = []
          python_files = []
          failures = []

          for current, dirs, filenames in os.walk("."):
              dirs[:] = [name for name in dirs if name not in excluded_dirs]
              for filename in filenames:
                  path = Path(current) / filename
                  if path.suffix.lower() in xml_suffixes:
                      xml_files.append(path)
                  elif path.suffix.lower() == ".py":
                      python_files.append(path)

          for path in xml_files:
              try:
                  ET.parse(path)
              except (ET.ParseError, OSError) as exc:
                  failures.append(f"XML parse error in {path}: {exc}")

          for path in python_files:
              try:
                  with tokenize.open(path) as stream:
                      source = stream.read()
                  compile(source, str(path), "exec")
              except (SyntaxError, UnicodeDecodeError, OSError) as exc:
                  failures.append(f"Python syntax error in {path}: {exc}")

          print(f"Parsed {len(xml_files)} XML-like file(s).")
          print(f"Checked {len(python_files)} Python file(s).")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY

          bash -n .devcontainer/entrypoint.sh .devcontainer/setup.sh

          echo "Checking colcon package discovery..."
          colcon list

          echo "Building workspace..."
          mkdir -p /home/vscode/ros2_ws
          colcon build --symlink-install \
            --build-base /home/vscode/ros2_ws/build \
            --install-base /home/vscode/ros2_ws/install \
            --log-base /home/vscode/ros2_ws/log

          test -f /home/vscode/ros2_ws/install/setup.bash
          source /home/vscode/ros2_ws/install/setup.bash
          CONTAINER_SCRIPT

      - name: Remove CI container
        if: always()
        run: |
          docker rm -f warrior1-ci || true
          docker compose -f .devcontainer/docker-compose.yml down --remove-orphans || true
